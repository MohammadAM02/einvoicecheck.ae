openapi: 3.1.0
info:
  title: UAE e-invoice preflight validation API
  version: 1.0.0
  description: >-
    Deterministic preflight validation for UAE PINT AE / UBL 2.1 invoices: TRN,
    required tax fields, line-item and document total arithmetic, VAT
    category/rate consistency, currency/code-list membership, and invoice-type
    detection.


    **Positioning guardrail — preflight validation only.** This API is NOT
    FTA-accredited, does NOT transmit legal e-invoices, does NOT replace an
    accredited ASP, and does NOT provide statutory archival.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    def-0:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
      title: ErrorReply
    def-1:
      type: object
      properties:
        status:
          type: string
        live:
          type: boolean
        checks:
          type: object
          properties:
            mongo:
              type: string
              enum:
                - up
                - down
            redis:
              type: string
              enum:
                - up
                - down
        timestamp:
          type: string
      title: HealthReply
    def-2:
      type: object
      properties:
        keyPrefix:
          type: string
        keyName:
          type: string
        totals:
          type: object
          properties:
            allTime:
              type: integer
            today:
              type: integer
            last30Days:
              type: integer
        outcomes:
          type: object
          properties:
            valid:
              type: integer
            invalid:
              type: integer
            error:
              type: integer
        recent:
          type: array
          items:
            type: object
            properties:
              endpoint:
                type: string
              method:
                type: string
              outcome:
                type: string
              statusCode:
                type: integer
              timestamp:
                type: string
      title: UsageReply
paths:
  /health:
    get:
      summary: Liveness/readiness probe (checks Mongo + Redis connectivity).
      tags:
        - ops
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-1"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-1"
  /v1/validate:
    post:
      summary: Preflight-validate a UAE invoice (JSON or UBL 2.1 / PINT AE XML).
      tags:
        - validation
      description: 'Deterministic preflight validation only. Does NOT transmit a legal
        e-invoice, is NOT FTA-accredited, and does not replace an accredited ASP
        or provide statutory archival. Send a canonical JSON invoice, an
        envelope { "document": "<Invoice>..." }, or raw UBL/PINT AE XML with
        Content-Type application/xml.'
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  invoiceType:
                    type:
                      - "null"
                      - string
                  schemaVersion:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        rule:
                          type: string
                        severity:
                          type: string
                          enum:
                            - error
                            - warning
                        message:
                          type: string
                        fix:
                          type: string
                      required:
                        - path
                        - rule
                        - severity
                        - message
                required:
                  - valid
                  - invoiceType
                  - schemaVersion
                  - errors
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /usage:
    get:
      summary: Usage metering for the calling API key.
      tags:
        - usage
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-2"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
tags:
  - name: validation
    description: Invoice preflight validation
  - name: usage
    description: Per-key usage metering
  - name: ops
    description: Operational probes
